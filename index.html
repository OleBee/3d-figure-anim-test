<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>3D Figure Anim Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; max-width: 320px; }
    #info h3 { margin: 0 0 8px 0; }
    #info p { margin: 4px 0; font-size: 14px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h3>3D-figur animasjonstest</h3>
    <p>Offentlig demo-modell (Three.js Soldier) med ekte animasjoner.</p>
    <p>Dra for å rotere • Scroll for zoom</p>
    <p><strong>Din modell:</strong> Boy.fbx fra night-mansion ligger klar i repoet (som base64). Bytt til FBXLoader og last den for å animere din egen figur.</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.Fog(0x111111, 5, 20);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 10, 5);
    dir.castShadow = true;
    scene.add(dir);
    const hemi = new THREE.HemisphereLight(0x88aaff, 0x444444, 0.6);
    scene.add(hemi);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5, 32),
      new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    let mixer;
    const clock = new THREE.Clock();

    // Load public animated model (Soldier from Three.js examples)
    const loader = new GLTFLoader();
    loader.load(
      'https://threejs.org/examples/models/gltf/Soldier.glb',
      (gltf) => {
        const model = gltf.scene;
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        model.scale.setScalar(1);
        scene.add(model);

        // Animations
        mixer = new THREE.AnimationMixer(model);
        const clips = gltf.animations;
        if (clips.length > 0) {
          const action = mixer.clipAction(clips[0]); // Idle or first clip
          action.play();
          // Cycle through animations every 4 seconds for demo
          let idx = 0;
          setInterval(() => {
            idx = (idx + 1) % clips.length;
            mixer.stopAllAction();
            mixer.clipAction(clips[idx]).reset().play();
          }, 4000);
        }
        console.log('Loaded Soldier with', clips.length, 'animations');
      },
      undefined,
      (err) => {
        console.error(err);
        document.getElementById('info').innerHTML += '<p style="color:#f66">Kunne ikke laste demo-modell.</p>';
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
