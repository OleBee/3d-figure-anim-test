<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Boy Figur – Animasjonstest</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); padding: 12px 16px; border-radius: 8px; max-width: 380px; font-size: 14px; }
    #info h3 { margin: 0 0 8px 0; }
    #info p { margin: 4px 0; }
    #error { color: #f88; white-space: pre-wrap; font-size: 12px; max-height: 120px; overflow: auto; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h3>Boy-figur (night-mansion)</h3>
    <p id="status">Laster modell...</p>
    <p>Dra for å rotere • Scroll for zoom</p>
    <div id="error"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.Fog(0x111111, 10, 30);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(5, 10, 7);
    dir.castShadow = true;
    scene.add(dir);
    const hemi = new THREE.HemisphereLight(0xb0c4ff, 0x444444, 0.6);
    scene.add(hemi);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5, 32),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    let model, mixer;
    const clock = new THREE.Clock();
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    function showError(msg) {
      errorEl.textContent = msg;
      console.error(msg);
    }

    async function loadBoy() {
      statusEl.textContent = 'Henter base64...';
      const resp = await fetch('boy_fbx.b64.txt');
      if (!resp.ok) throw new Error(`HTTP ${resp.status} ved henting av base64`);
      let b64 = await resp.text();
      b64 = b64.replace(/\s/g, ''); // fjern all whitespace
      if (b64.length < 10000) throw new Error(`base64 for kort (${b64.length} tegn)`);

      statusEl.textContent = 'Dekoder base64...';
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      // Lag en Blob URL så FBXLoader kan bruke load() i stedet for parse()
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);

      statusEl.textContent = 'Laster FBX...';
      const loader = new FBXLoader();
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          (fbx) => {
            URL.revokeObjectURL(url);
            // Prøv flere skalaer – FBX kan være i cm eller meter
            fbx.scale.setScalar(0.01);
            fbx.position.y = 0;
            fbx.traverse(c => {
              if (c.isMesh) {
                c.castShadow = true;
                c.receiveShadow = true;
                if (c.material) c.material.side = THREE.DoubleSide;
              }
            });
            scene.add(fbx);
            model = fbx;
            statusEl.textContent = 'Boy.fbx lastet';
            console.log('Boy loaded successfully', fbx);
            resolve();
          },
          undefined,
          (err) => {
            URL.revokeObjectURL(url);
            reject(err);
          }
        );
      });
    }

    function loadFallback() {
      statusEl.textContent = 'Laster fallback (Soldier)...';
      const loader = new GLTFLoader();
      loader.load(
        'https://threejs.org/examples/models/gltf/Soldier.glb',
        (gltf) => {
          const m = gltf.scene;
          m.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
          scene.add(m);
          model = m;
          mixer = new THREE.AnimationMixer(m);
          if (gltf.animations.length) mixer.clipAction(gltf.animations[0]).play();
          statusEl.textContent = 'Fallback: Soldier (Boy feilet)';
        },
        undefined,
        (err) => showError('Fallback feilet også: ' + err.message)
      );
    }

    loadBoy().catch(err => {
      const msg = err.message || String(err);
      showError('Boy.fbx feilet:\n' + msg);
      statusEl.textContent = 'Boy feilet – bruker fallback';
      loadFallback();
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();
      if (mixer) mixer.update(delta);
      if (model && !mixer) {
        model.position.y = Math.sin(t * 1.8) * 0.05;
        model.rotation.y = Math.sin(t * 0.35) * 0.25;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
